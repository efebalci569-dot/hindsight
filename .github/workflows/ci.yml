name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '*.md', 'docs/**']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Hindsight.sln -c Release

      - name: Unit tests
        run: dotnet test Hindsight.sln -c Release --no-build
